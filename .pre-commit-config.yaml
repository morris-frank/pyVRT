# Hooks are the single commit-time definition of static checks; CI runs them too.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  # Local hooks call the mise-managed binaries, so versions live only in mise.toml.
  - repo: local
    hooks:
      - id: ruff-format
        name: format Python
        entry: mise exec -- ruff format
        language: system
        types: [python]
      - id: ruff-lint
        name: lint Python
        entry: mise exec -- ruff check --fix
        language: system
        types: [python]
      - id: staged-secrets
        name: scan staged changes for secrets
        entry: mise exec -- gitleaks git --staged --redact --verbose
        language: system
        pass_filenames: false
        always_run: true
      - id: tests
        name: run tests before push
        entry: mise exec -- uv run --frozen pytest
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
